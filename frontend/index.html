    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DoctorAibolit",
      "description": "Get instant, private answers about symptoms, wellness, and next steps — no signup required.",
      "url": "https://doctoraibolit.com",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier with 5 messages, additional messages available for purchase"
      },
      "featureList": [
        "No signup required",
        "Private and anonymous",
        "Instant AI support",
        "24/7 availability",
        "Non-medical support"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is DoctorAibolit free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DoctorAibolit offers 5 free messages to start. No signup or login required. You can purchase additional messages if needed."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, DoctorAibolit requires no signup, login, or account creation. You can start chatting immediately and anonymously."
          }
        },
        {
          "@type": "Question",
          "name": "Is DoctorAibolit a medical service?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, DoctorAibolit provides informational health guidance only. It is not a replacement for professional medical care, diagnosis, or treatment. For medical emergencies, contact emergency services immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Is my conversation private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, conversations are private and anonymous. No login is required, and your data is handled securely."
          }
        },
        {
          "@type": "Question",
          "name": "How does DoctorAibolit work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Simply describe your symptoms or health question. The AI provides clear, informative responses about health topics and guidance on next steps. No signup needed."
          }
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "DoctorAibolit Health Guidance Messages",
      "description": "AI-powered health information and guidance for symptoms and wellness",
      "brand": {
        "@type": "Brand",
        "name": "DoctorAibolit"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "20 Messages",
          "price": "1.99",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        },
        {
          "@type": "Offer",
          "name": "50 Messages",
          "price": "3.99",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      ]
    }
    </script>

      },
