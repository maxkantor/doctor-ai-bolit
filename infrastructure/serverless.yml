service: doctor-ai-bolit

frameworkVersion: '4'

provider:
  name: aws
  runtime: dotnet10
  region: us-east-1
  memorySize: 512
  timeout: 60
  environment:
    DYNAMODB_TABLE_VISITORS: DoctorAibolitVisitors
    DYNAMODB_TABLE_CHAT_SESSIONS: DoctorAibolitChatSessions
    DYNAMODB_TABLE_CHAT_MESSAGES: DoctorAibolitChatMessages
    DYNAMODB_TABLE_CONTACT_MESSAGES: DoctorAibolitContactMessages
    DYNAMODB_TABLE_PRICING_CONFIG: DoctorAibolitPricingConfig
    DYNAMODB_TABLE_PRICING_PLANS: DoctorAibolitPricingPlans
    DYNAMODB_TABLE_VISITOR_SESSIONS: DoctorAibolitVisitorSessions
    S3_BUCKET_OG_IMAGES: doctoraibolit-og-images
    SES_FROM_EMAIL: noreply@doctoraibolit.com
    SES_ADMIN_EMAIL: admin@doctoraibolit.com
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/Visitors
            - arn:aws:dynamodb:${self:provider.region}:*:table/ChatSessions
            - arn:aws:dynamodb:${self:provider.region}:*:table/ChatMessages
            - arn:aws:dynamodb:${self:provider.region}:*:table/ContactMessages
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:doctoraibolit*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::doctoraibolit-og-images/*
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-ADMIN-KEY
        - X-Visitor-Id
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      maxAge: 600

package:
  patterns:
    - '!**'
    - '../backend/bin/Release/net10.0/**'
    - '../backend/obj/**'

functions:
  api:
    handler: DoctorAIBolit.Api::DoctorAIBolit.LambdaEntryPoint::FunctionHandlerAsync
    package:
      patterns:
        - '!**'
        - '../backend/bin/Release/net10.0/**'
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

resources:
  Resources:
    VisitorsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Visitors
        AttributeDefinitions:
          - AttributeName: VisitorId
            AttributeType: S
        KeySchema:
          - AttributeName: VisitorId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ChatSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChatSessions
        AttributeDefinitions:
          - AttributeName: VisitorId
            AttributeType: S
          - AttributeName: SessionId
            AttributeType: S
        KeySchema:
          - AttributeName: VisitorId
            KeyType: HASH
          - AttributeName: SessionId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    ChatMessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChatMessages
        AttributeDefinitions:
          - AttributeName: SessionId
            AttributeType: S
          - AttributeName: Timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: SessionId
            KeyType: HASH
          - AttributeName: Timestamp
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    ContactMessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ContactMessages
        AttributeDefinitions:
          - AttributeName: MessageId
            AttributeType: S
        KeySchema:
          - AttributeName: MessageId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    OgImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: doctoraibolit-og-images
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - HEAD
              AllowedHeaders:
                - '*'

    OgImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref OgImagesBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${OgImagesBucket}/*'

